name: Refresh DIU knowledge

on:
  schedule:
    - cron: "17 */12 * * *"
  workflow_dispatch:

concurrency:
  group: diu-knowledge-refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RUNTIME_CATALOG_BACKEND: database
      RAG_VECTOR_BACKEND: pgvector
      RAG_TABLE_NAME: diu_knowledge_chunks_hosted
      EMBEDDING_BACKEND: openai
      EMBEDDING_API_BASE: https://generativelanguage.googleapis.com/v1beta/openai/
      EMBEDDING_API_KEY: ${{ secrets.EMBEDDING_API_KEY }}
      EMBEDDING_API_MODEL: gemini-embedding-2
      EMBEDDING_DIMENSION: "768"
      DB_POOL_MIN_SIZE: "1"
      DB_POOL_MAX_SIZE: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install refresh dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Collect, validate, and publish
        run: python scripts/refresh_knowledge.py

      - name: Preserve non-secret refresh evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diu-refresh-${{ github.run_id }}
          path: .refresh-work/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
